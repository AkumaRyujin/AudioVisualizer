<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140208"/>
      <stop offset="100%" stop-color="#20040c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00a2ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base redondeada con borde de acento -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Barras del espectro -->
  <g filter="url(#glow)">
    <!-- Barra 1 -->
    <rect x="22" y="70" width="7" height="34" rx="3.5" fill="url(#cyanGrad)"/>
    <!-- Barra 2 -->
    <rect x="33" y="52" width="7" height="52" rx="3.5" fill="url(#cyanGrad)"/>
    <!-- Barra 3 -->
    <rect x="44" y="36" width="7" height="68" rx="3.5" fill="url(#glowGrad)"/>
    <!-- Barra 4 -->
    <rect x="55" y="24" width="7" height="80" rx="3.5" fill="url(#glowGrad)"/>
    <!-- Barra 5 -->
    <rect x="66" y="32" width="7" height="72" rx="3.5" fill="url(#glowGrad)"/>
    <!-- Barra 6 -->
    <rect x="77" y="46" width="7" height="58" rx="3.5" fill="url(#magentaGrad)"/>
    <!-- Barra 7 -->
    <rect x="88" y="62" width="7" height="42" rx="3.5" fill="url(#magentaGrad)"/>
    <!-- Barra 8 -->
    <rect x="99" y="78" width="7" height="26" rx="3.5" fill="url(#magentaGrad)"/>
  </g>

  <!-- Puntos / marcadores de pico flotantes -->
  <circle cx="25.5" cy="62" r="2.5" fill="#00f0ff"/>
  <circle cx="36.5" cy="44" r="2.5" fill="#00f0ff"/>
  <circle cx="47.5" cy="28" r="2.5" fill="#00f0ff"/>
  <circle cx="58.5" cy="16" r="2.5" fill="#ffffff"/>
  <circle cx="69.5" cy="24" r="2.5" fill="#00f0ff"/>
  <circle cx="80.5" cy="38" r="2.5" fill="#ff007f"/>
  <circle cx="91.5" cy="54" r="2.5" fill="#ff007f"/>
  <circle cx="102.5" cy="70" r="2.5" fill="#ff007f"/>

  <!-- Línea de base cartesiana -->
  <line x1="18" y1="105" x2="110" y2="105" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
